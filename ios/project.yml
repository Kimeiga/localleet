# XcodeGen spec: `xcodegen generate` (after scripts/prepare.sh) creates LocalLeet.xcodeproj
name: LocalLeet
options:
  bundleIdPrefix: io.github.kimeiga
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  LocalLeet:
    type: application
    platform: iOS
    sources:
      - path: LocalLeet
        excludes:
          - web
          - "*.entitlements"
      # The bundled web app is copied as a folder so its directory layout is kept.
      - path: LocalLeet/web
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: true
      - sdk: WebKit.framework
      - sdk: Network.framework
    info:
      path: LocalLeet/Info.plist
      properties:
        CFBundleDisplayName: LocalLeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
        # The web app is served from 127.0.0.1 inside the app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kimeiga.localleet
        PRODUCT_NAME: LocalLeet
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        # Set LL_ENTITLEMENTS=LocalLeet/LocalLeet-IncreasedMemory.entitlements to request
        # the increased memory limit (the App ID needs that capability enabled first).
        CODE_SIGN_ENTITLEMENTS: $(LL_ENTITLEMENTS)
        LL_ENTITLEMENTS: ""
schemes:
  LocalLeet:
    build:
      targets:
        LocalLeet: all
    run:
      config: Debug
    archive:
      config: Release
