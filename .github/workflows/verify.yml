name: verify

on:
  push:
  pull_request:

jobs:
  problems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every reference solution must pass its own tests; starters must run.
      - run: node scripts/verify.mjs
